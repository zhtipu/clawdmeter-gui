name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

# a newer push replaces a run that is still going
concurrency:
  group: build-mac
  cancel-in-progress: true

jobs:
  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-14          # Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Self-check (logic, usage parser, login item, theme patch, every page renders)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SHOT_DIR: ${{ runner.temp }}/shots
        run: python ci_check.py

      - name: Build the app and the disk image
        env:
          USE_VENV: "0"
          SKIP_CHECK: "1"
        run: bash build_mac.sh

      - name: Start the built app once and take a screenshot
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          SHOT: ${{ runner.temp }}/shots/built-app.png
        run: |
          mkdir -p "${{ runner.temp }}/shots"
          python - <<'PY'
          import os, subprocess, sys
          exe = "dist/Clawdmeter.app/Contents/MacOS/Clawdmeter"
          shot = os.environ["SHOT"]
          try:
              p = subprocess.run([exe, "--page", "0", "--shot", shot, "--delay", "5000"],
                                 capture_output=True, text=True, timeout=120)
          except subprocess.TimeoutExpired:
              print("::error::The built app did not finish within 120 seconds")
              sys.exit(1)
          except OSError as e:
              print("::error::Could not start the built app: " + str(e))
              sys.exit(1)
          out = ((p.stdout or "") + (p.stderr or "")).strip()
          print(out[-2000:])
          ok = p.returncode == 0 and os.path.exists(shot) and os.path.getsize(shot) > 5000
          if not ok:
              tail = out[-700:].replace("%", "%25").replace("", "").replace("
", "%0A")
              print("::error::Built app exit code " + str(p.returncode) + ", screenshot written: " + str(os.path.exists(shot)) + "%0A" + tail)
              sys.exit(1)
          PY

      - name: Zip the app too
        run: ditto -c -k --keepParent dist/Clawdmeter.app dist/Clawdmeter-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clawdmeter-macOS-arm64
          path: |
            dist/Clawdmeter.dmg
            dist/Clawdmeter-arm64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
