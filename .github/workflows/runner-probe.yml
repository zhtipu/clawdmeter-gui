name: Runner check

# A job that does almost nothing, to see whether GitHub-hosted runners start for this account at all.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/runner-probe.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "hosted Linux runner is working"
